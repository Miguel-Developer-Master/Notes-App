<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/signUp.css">
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>
    <main id="test">
        <form id="signUpForm">

            <h1 id="main-title">Sign Up</h1>

            <div id="container">

                <fieldset>
                    <legend>Username</legend>
                    <input id="username" type="text" required>
                </fieldset>

                <fieldset>
                    <legend>Email</legend>
                    <input id="email" type="email" required>
                </fieldset>

                <fieldset>
                    <legend>Password</legend>
                    <input id="password" type="password" required>
                </fieldset>

                <button id="signUpButton">Submit</button>

                <p id="login-link-text">Already have an account? Go to <a href="/login">login page</a></p>
            </div>

        </form>
    </main>
<script type="module" src="/js/signUp.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/createNote.css">
    <meta charset="UTF-8">
    <title>Create a note</title>
</head>
<body>
    <header>
        <h1 id="main-title">Create a note</h1>
    </header>
    <main>
        <section id="create-note">
            <form id="create-note-form">

                <fieldset class="fieldsets">
                    <legend>Note Title</legend>
                    <input type="text" class="inputs" id="title" placeholder="Today's note, etc" required>
                </fieldset>

                <fieldset class="fieldsets">
                    <legend>Note content</legend>
                    <textarea class="inputs" id="content" placeholder="Today I went to my job and ..., etc" required></textarea>
                </fieldset>

                <button id="submit-button">Submit</button>
            </form>
        </section>
    </main>
<script type="module" src="/js/createNote.js"></script>
</body>
</html>

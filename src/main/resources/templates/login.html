<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/login.css">
    <meta charset="UTF-8">
    <title>Login Into your account</title>
</head>
<body>
    <main>
        <h1 id="main-title">Login into your account</h1>

        <form id="login-form">
            <fieldset>
                <legend>Email</legend>
                <input type="text" id="email" required>
            </fieldset>

            <fieldset>
                <legend>Password</legend>
                <input type="password" id="password" required>
            </fieldset>

            <button id="submit-button">Login</button>

            <p id="signup-link-text">Don't have an account yet? go to <a href="/signUp">sign up page</a></p>
        </form>
    </main>
<script type="module" src="/js/login.js"></script>
</body>
</html>

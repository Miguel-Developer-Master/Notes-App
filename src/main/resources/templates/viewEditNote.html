<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/viewEditNote.css">
    <meta charset="UTF-8">
    <title>View and Edit a note</title>
</head>
<body>
    <header>
        <input type="text" id="note-title">
    </header>
    <main>
        <section id="note-section">
            <textarea id="note-content"></textarea>
        </section>

        <section id="action-buttons">
            <button id="save-button" class="buttons">Save</button>
            <button id="cancel-button" class="buttons">Cancel</button>
        </section>
    </main>
<script type="module" src=/js/viewEditNote.js></script>
</body>
</html>
